# GitHub Pages 게시 설정
#
# 관리자 도구(admin.html / admin.js / serve.ps1)는 로컬 서버가 있어야 동작한다.
# Pages에는 백엔드가 없어 올라가도 로그인할 수 없으므로, 저장소에는 두되
# 공개 사이트에는 게시하지 않는다.
#
# 주의: 이 설정이 동작하려면 .nojekyll 파일이 없어야 한다.
#       (.nojekyll 이 있으면 Jekyll 처리가 꺼져 exclude 가 무시된다)

exclude:
  - admin.html
  - admin.js
  - admin.config.example.json
  - serve.ps1
  - start-server.bat
  - _tools
  - README.md
  - .gitignore
