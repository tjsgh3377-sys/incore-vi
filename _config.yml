# GitHub Pages 게시 설정
#
# 관리자 화면(/admin/)은 Pages에도 함께 게시한다.
# 백엔드가 없으므로 웹에서는 GitHub API로 저장소에 직접 커밋한다. (admin/backend.js)
# 로컬 서버 도구(serve.ps1 등)는 웹에서 쓸 일이 없으므로 게시하지 않는다.
#
# 주의: 이 설정이 동작하려면 .nojekyll 파일이 없어야 한다.
#       (.nojekyll 이 있으면 Jekyll 처리가 꺼져 exclude 가 무시된다)

exclude:
  - serve.ps1
  - start-server.bat
  - admin.config.example.json
  - _tools
  - README.md
  - .gitignore
