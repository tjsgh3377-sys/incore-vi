<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INCORE · 관리자</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <style>
    :root { --mint:#00c7be; --mint-dark:#00a89f; --line:#e3e6ec; --bg:#f4f6f9; --muted:#6b7280; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Pretendard",system-ui,sans-serif; background:var(--bg); color:#1f2330; }
    a { color:var(--mint-dark); }
    #login { min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .login-card { background:#fff; padding:40px; border-radius:14px; box-shadow:0 10px 40px rgba(0,0,0,.08); width:340px; text-align:center; }
    .login-card img { height:42px; margin-bottom:18px; object-fit:contain; }
    .login-card h1 { font-size:18px; margin:0 0 22px; font-weight:700; }
    header.top { background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
    .top-in { max-width:1000px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; gap:14px; }
    .top-in img { height:30px; object-fit:contain; }
    .top-in .sp { flex:1; }
    .top-in .who { color:var(--muted); font-size:13px; }
    main { max-width:1000px; margin:0 auto; padding:24px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:22px 24px; margin-bottom:20px; }
    .card h2 { font-size:15px; margin:0 0 18px; color:var(--mint-dark); font-weight:700; letter-spacing:.02em; }
    label { display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
    input[type=text], textarea {
      width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
      font-family:inherit; font-size:14px; background:#fcfcfd;
    }
    textarea { min-height:96px; resize:vertical; line-height:1.6; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 18px; }
    .img-field { display:flex; align-items:center; gap:14px; margin-top:6px; }
    .thumb { width:70px; height:70px; border:1px solid var(--line); border-radius:8px; object-fit:contain; background:#fff; }
    .repeat-item { border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; background:#fafbfd; position:relative; }
    .repeat-item .rm { position:absolute; top:10px; right:10px; background:#fff; border:1px solid var(--line); border-radius:6px; cursor:pointer; font-size:12px; padding:4px 8px; color:#b42318; }
    button.btn { background:var(--mint); color:#fff; border:0; border-radius:8px; padding:11px 20px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
    button.btn:hover { background:var(--mint-dark); }
    button.ghost { background:#fff; color:var(--mint-dark); border:1px solid var(--mint); }
    button:disabled { opacity:.5; cursor:default; }
    .file-btn { position:relative; overflow:hidden; display:inline-block; }
    .file-btn input[type=file] { position:absolute; inset:0; opacity:0; cursor:pointer; }
    .savebar { position:sticky; bottom:0; background:#fff; border-top:1px solid var(--line); padding:14px 24px; display:flex; gap:12px; align-items:center; justify-content:flex-end; }
    .savebar .msg { margin-right:auto; font-size:13px; }
    .msg.ok { color:#157347; } .msg.err { color:#b42318; }
    .hint { font-size:12px; color:var(--muted); margin-top:4px; }
    .hidden { display:none !important; }
    .dual-cols { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
    .lang-tag { font-size:11px; color:var(--muted); font-weight:700; margin:2px 0 4px; letter-spacing:.02em; }
    .infobar { background:#e8fbfa; border:1px solid #b6ecea; color:#0b7d77; border-radius:10px; padding:12px 16px; font-size:13px; line-height:1.6; margin-bottom:20px; }
    /* 좌측 탭 레이아웃 */
    .layout { max-width:1220px; margin:0 auto; display:flex; align-items:flex-start; }
    #sidenav { position:sticky; top:60px; width:214px; flex:0 0 214px; padding:22px 12px 22px 18px; align-self:flex-start; max-height:calc(100vh - 60px); overflow:auto; }
    #sidenav .navtitle { font-size:11px; font-weight:700; color:var(--muted); letter-spacing:.06em; margin:6px 8px 10px; }
    #sidenav a { display:flex; align-items:center; gap:9px; padding:10px 13px; border-radius:9px; font-size:14px; font-weight:600; color:#4b5563; text-decoration:none; margin-bottom:3px; cursor:pointer; user-select:none; }
    #sidenav a:hover { background:#eef1f5; }
    #sidenav a.active { background:var(--mint); color:#fff; }
    #sidenav a .ic { font-size:15px; width:18px; text-align:center; }
    main#form { flex:1 1 auto; min-width:0; max-width:none; margin:0; padding:24px 28px; }
    .sec { display:none; }
    .sec.active { display:block; }
    @media (max-width:820px) {
      .layout { flex-direction:column; }
      #sidenav { position:static; width:100%; flex:none; max-height:none; display:flex; flex-wrap:wrap; gap:6px; border-bottom:1px solid var(--line); }
      #sidenav .navtitle { display:none; }
      #sidenav a { margin:0; }
    }
  </style>
</head>
<body>
  <div id="login">
    <div class="login-card">
      <img src="assets/logo.png" alt="INCORE">
      <h1>INCORE 베트남 사이트 관리자</h1>
      <input type="password" id="pw" placeholder="비밀번호" style="width:100%;padding:11px 12px;border:1px solid #e3e6ec;border-radius:8px;font-size:14px;font-family:inherit;">
      <div id="loginErr" class="msg err" style="font-size:13px;margin:10px 0 0;min-height:16px;"></div>
      <button class="btn" id="loginBtn" style="width:100%;margin-top:14px;">로그인</button>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="top">
      <div class="top-in">
        <img src="assets/logo.png" alt="INCORE">
        <strong>관리자 페이지</strong>
        <span class="sp"></span>
        <a href="index.html" target="_blank" class="who">사이트 보기 ↗</a>
        <button class="ghost" id="logoutBtn" style="padding:7px 14px;border-radius:7px;cursor:pointer;">로그아웃</button>
      </div>
    </header>
    <div class="layout">
      <nav id="sidenav"><!-- admin.js가 생성 --></nav>
      <main id="form"><!-- admin.js가 생성 --></main>
    </div>
    <div class="savebar">
      <span class="msg" id="saveMsg"></span>
      <button class="ghost" id="reloadBtn" style="border-radius:8px;padding:11px 18px;cursor:pointer;">되돌리기</button>
      <button class="btn" id="saveBtn">저장하기</button>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
